<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shorts Auto-Poster{% endblock %}</title>
    <!-- Tailwind CSS (Play CDN for dev, overridden by compiled output in Docker) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/dashboard/input.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.14.0/dist/cdn.min.js"></script>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="/static/dashboard/app.js"></script>
</head>
<body class="h-full flex flex-col md:flex-row font-sans antialiased" x-data="{
    toasts: [],
    showToast(message, type = 'info') {
        let msg = message;
        let t = type;
        if (typeof message === 'object' && message !== null) {
            msg = message.message || message.text || (typeof message.value === 'string' ? message.value : (message.value ? message.value.message : ''));
            t = message.type || (message.value && message.value.type) || type;
        }
        if (!msg || typeof msg !== 'string' || msg.trim() === '') return;
        const id = Date.now() + Math.random();
        this.toasts.push({ id, message: msg.trim(), type: t });
        setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
        }, 5000);
    }
}" x-init="window.showToast = showToast.bind($data)">

    <!-- Toast Notification Container -->
    <div class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="pointer-events-auto px-4 py-3 rounded-lg shadow-lg text-sm font-medium transition-all transform duration-300 flex items-center justify-between min-w-[280px]"
                 :class="{
                     'bg-emerald-600 text-white': toast.type === 'success',
                     'bg-rose-600 text-white': toast.type === 'error',
                     'bg-amber-600 text-white': toast.type === 'warning',
                     'bg-indigo-600 text-white': toast.type === 'info'
                 }">
                <span x-text="toast.message"></span>
                <button @click="toasts = toasts.filter(t => t.id !== toast.id)" class="ml-3 text-white/80 hover:text-white">&times;</button>
            </div>
        </template>
    </div>

    <!-- Sidebar / Mobile Header -->
    <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col shrink-0">
        <div class="p-5 border-b border-slate-800 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <span class="text-2xl font-black bg-gradient-to-r from-red-500 to-indigo-500 bg-clip-text text-transparent">Shorts</span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-300">Poster</span>
            </a>
            <!-- Mobile Menu Toggle Button -->
            <button class="md:hidden text-slate-400 hover:text-white" @click="mobileMenuOpen = !mobileMenuOpen" x-data="{ mobileMenuOpen: false }">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <nav class="flex-1 p-4 space-y-1.5 text-sm font-medium">
            <a href="/" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/80 {% if request.path == '/' %}bg-indigo-600 text-white font-semibold{% else %}text-slate-300 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>Overview</span>
            </a>
            <a href="/approvals" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/80 {% if request.path == '/approvals' %}bg-indigo-600 text-white font-semibold{% else %}text-slate-300 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>Approvals</span>
            </a>
            <a href="/videos" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/80 {% if request.path == '/videos' %}bg-indigo-600 text-white font-semibold{% else %}text-slate-300 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                <span>Videos</span>
            </a>
            <a href="/queue" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/80 {% if request.path == '/queue' %}bg-indigo-600 text-white font-semibold{% else %}text-slate-300 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                <span>Queue</span>
            </a>
            <a href="/settings" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/80 {% if request.path == '/settings' %}bg-indigo-600 text-white font-semibold{% else %}text-slate-300 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span>Settings</span>
            </a>
            <a href="/accounts" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/80 {% if request.path == '/accounts' %}bg-indigo-600 text-white font-semibold{% else %}text-slate-300 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span>Accounts</span>
            </a>
            <a href="/logs" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/80 {% if request.path == '/logs' %}bg-indigo-600 text-white font-semibold{% else %}text-slate-300 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                <span>Logs</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 flex items-center justify-between">
            <div class="text-xs text-slate-400">
                <span class="block font-semibold text-slate-300">Admin</span>
                <span class="truncate block max-w-[140px]">{{ request.session.admin_email|default:"Owner" }}</span>
            </div>
            <form action="/logout" method="POST">
                {% csrf_token %}
                <button type="submit" class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-h-screen overflow-y-auto bg-slate-900">
        <!-- Global Alerts / Warnings -->
        {% block banner %}{% endblock %}

        <div class="flex-1 p-6 lg:p-8 max-w-7xl w-full mx-auto">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
