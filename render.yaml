services:
  - type: web
    name: shorts-autoposter
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Only ONE environment variable is required on Render!
      # All application keys, secrets, API tokens, and configurations are
      # automatically loaded from your TiDB database on boot.
      - key: DATABASE_URL
        sync: false
